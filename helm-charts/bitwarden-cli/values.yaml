replicaCount: 1

image:
  repository: ghcr.io/majabojarska/bitwarden-cli
  pullPolicy: IfNotPresent
  tag: "2026.7.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

container:
  port: 8087

config:
  bwHost: vault.bitwarden.eu
  bitwardenCliDebug: "false"

auth:
  # Existing Secret with keys: BW_CLIENTID, BW_CLIENTSECRET, BW_PASSWORD.
  # Set to empty string to let this chart create the Secret from auth.client* and auth.password.
  # Default keeps chart install/lint non-interactive.
  existingSecret: bitwarden-cli-auth
  # Used only when existingSecret is empty.
  # A Secret managed by this chart will be created.
  clientId: ""
  clientSecret: ""
  password: ""

persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /home/bitwarden/appdata

service:
  type: ClusterIP
  port: 8087

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  tcpSocket:
    port: http
readinessProbe:
  tcpSocket:
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
